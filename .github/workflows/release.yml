name: Package WoW Addon

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    # Only the repository owner may publish packs; releases by anyone else build nothing.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mutagen

      # Each pack has its own tag series (see release.py). A language ships as two packs,
      # quests and books & gossip (see split_voiceovers.py):
      #   v3.4.0              -> ChattyLittleNpc_Vanilla_enUS_voiceovers
      #   deDE-v1.0.0         -> ChattyLittleNpc_Vanilla_deDE_voiceovers
      #   Gossip-enUS-v1.0.0  -> ChattyLittleNpc_Vanilla_Gossip_enUS_voiceovers
      # An optional -beta/-alpha suffix is allowed. The tag's version must match the pack's ## Version.
      - name: Find the pack for this tag
        id: pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          part=""
          if [[ "$TAG" =~ ^([A-Za-z]+)-([a-z]{2}[A-Z]{2})-v(.+)$ ]]; then
            part="${BASH_REMATCH[1]}"; locale="${BASH_REMATCH[2]}"; rest="${BASH_REMATCH[3]}"
          elif [[ "$TAG" =~ ^([a-z]{2}[A-Z]{2})-v(.+)$ ]]; then
            locale="${BASH_REMATCH[1]}"; rest="${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ ^v(.+)$ ]]; then
            locale="enUS"; rest="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag '$TAG' is not v<version>, <locale>-v<version> or <Part>-<locale>-v<version>"; exit 1
          fi
          version="${rest%-beta}"; version="${version%-alpha}"

          name="ChattyLittleNpc_Vanilla_${part:+${part}_}${locale}_voiceovers"
          if [ ! -f "$name/$name.toc" ]; then
            echo "::error::Tag $TAG names pack $name, but $name/$name.toc does not exist"; exit 1
          fi

          toc_version=$(sed -n 's/^## Version:[[:space:]]*//p' "$name/$name.toc" | tr -d '\r' | sed 's/[[:space:]]*$//')
          if [ "$toc_version" != "$version" ]; then
            echo "::error::Tag $TAG is version $version but $name.toc has ## Version $toc_version"; exit 1
          fi

          echo "Building $name $version"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # ZIP suffix without the pack key (the folder name already has it), e.g. v1.0.0 or v1.0.0-beta
          echo "label=v${rest}" >> "$GITHUB_OUTPUT"

      - name: Generate VoiceoversList.lua
        run: python generate_voiceovers_list.py "${{ steps.pack.outputs.name }}"

      - name: Create Addon ZIP
        env:
          NAME: ${{ steps.pack.outputs.name }}
          LABEL: ${{ steps.pack.outputs.label }}
        run: |
          mkdir dist
          zip -r "dist/$NAME-$LABEL.zip" "$NAME" -x "$NAME/.vscode/*"
          ls -lh dist

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
